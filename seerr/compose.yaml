services:
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:v3.4.1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1" ]
      start_period: 20s
      interval: 15s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.seerr.rule: "Host(`seerr.zech.co`)"
      traefik.http.routers.seerr.entrypoints: "websecure"
      traefik.http.routers.seerr.tls: "true"
      traefik.http.routers.seerr.middlewares: "security-headers@file,compression@file"
      traefik.http.services.seerr.loadbalancer.server.port: "5055"
    environment:
      TZ: Europe/Vienna
    volumes:
      - /opt/appdata/seerr/config:/app/config
    networks:
      - proxy

networks:
  proxy:
    external: true