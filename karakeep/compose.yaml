services:
  meilisearch:
    container_name: karakeep-meilisearch
    image: getmeili/meilisearch:v1.52.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:7700/health
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 5s
    env_file:
      - .env
    environment:
          MEILI_ADDR: http://meilisearch:7700
          BROWSER_WEB_URL: http://chrome:9222
    volumes:
      - /opt/appdata/karakeep/meilisearch:/meili_data
    networks:
      - internal

  chrome:
    container_name: karakeep-chrome
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
          - --no-sandbox
          - --disable-gpu
          - --disable-dev-shm-usage
          - --remote-debugging-address=0.0.0.0
          - --remote-debugging-port=9222
          - --hide-scrollbars
          - --disable-blink-features=AutomationControlled
          - --window-size=1440,900
    networks:
      - internal

  karakeep:
    container_name: karakeep
    image: ghcr.io/karakeep-app/karakeep:0.33.1
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 5s
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.karakeep.rule: "Host(`karakeep.zech.co`)"
      traefik.http.routers.karakeep.entrypoints: "websecure"
      traefik.http.routers.karakeep.tls: "true"
      traefik.http.routers.karakeep.middlewares: "security-headers@file,compression@file"
      traefik.http.services.karakeep.loadbalancer.server.port: "3000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
    volumes:
      - /opt/appdata/karakeep/data:/data
    networks:
      - proxy
      - internal
    depends_on:
      meilisearch:
        condition: service_healthy

networks:
  proxy:
    external: true

  internal:
    name: karakeep-internal
    driver: bridge

