              method: GET
              timeout: 5s
              alt-status-codes: [204, 301, 302, 401, 403]
            - title: Traefik Manager
              url: https://traefik-manager.zech.co
              check-url: https://traefik-manager.zech.co/api/health
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/traefik-manager.svg
              method: GET
              timeout: 5s
              alt-status-codes: [204, 301, 302, 401, 403]

