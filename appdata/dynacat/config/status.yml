- name: Status
  slug: status
  name-icon: mdi:server-network
  width: wide
  columns:
    - size: full
      widgets:
        - type: monitor
          title: Infrastruktur
          style: compact
          cache: 1m
          update-interval: 2m
          sites:
            - title: Traefik
              url: https://traefik.zech.co
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/traefik.svg
              method: GET
              timeout: 5s
              alt-status-codes: [204, 301, 302, 401, 403]
            - title: Authentik
              url: https://sso.zech.co
              icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/authentik.svg
              method: GET
              timeout: 5s
              alt-status-codes: [204, 301, 302, 401, 403]
