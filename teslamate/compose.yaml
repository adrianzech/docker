services:
  database:
    container_name: teslamate-database
    image: postgres:18.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - /opt/appdata/teslamate/database:/var/lib/postgresql
    networks:
      - internal

  teslamate:
    container_name: teslamate-app
    image: teslamate/teslamate:4.1.1
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.teslamate.rule: "Host(`teslamate.zech.co`)"
      traefik.http.routers.teslamate.entrypoints: "websecure"
      traefik.http.routers.teslamate.tls: "true"
      traefik.http.routers.teslamate.middlewares: "authentik@file,security-headers@file,compression@file"
      traefik.http.services.teslamate.loadbalancer.server.port: "4000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASSWORD}
      MQTT_HOST: mosquitto
    volumes:
      - /opt/appdata/teslamate/import:/opt/app/import
    networks:
      - proxy
      - internal
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started

  grafana:
    container_name: teslamate-grafana
    image: teslamate/grafana:4.0.1
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.teslamate-grafana.rule: "Host(`teslamate-grafana.zech.co`)"
      traefik.http.routers.teslamate-grafana.entrypoints: "websecure"
      traefik.http.routers.teslamate-grafana.tls: "true"
      traefik.http.routers.teslamate-grafana.middlewares: "security-headers@file,compression@file"
      traefik.http.services.teslamate-grafana.loadbalancer.server.port: "3000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASSWORD}
    volumes:
      - /opt/appdata/teslamate/grafana:/var/lib/grafana
    networks:
      - proxy
      - internal
    depends_on:
      database:
        condition: service_healthy

  mosquitto:
    container_name: teslamate-mosquitto
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - /opt/appdata/teslamate/mosquitto/config:/mosquitto/config
      - /opt/appdata/teslamate/mosquitto/data:/mosquitto/data
    networks:
      - internal

networks:
  proxy:
    external: true

  internal:
    name: teslamate-internal
    driver: bridge