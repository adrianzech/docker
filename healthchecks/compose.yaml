services:
  database:
    container_name: healthchecks-database
    image: postgres:18.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - /opt/appdata/healthchecks/postgres:/var/lib/postgresql
    networks:
      - internal

  healthchecks:
    container_name: healthchecks
    image: healthchecks/healthchecks:v4.3
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.healthchecks.rule: "Host(`healthchecks.zech.co`)"
      traefik.http.routers.healthchecks.entrypoints: "websecure"
      traefik.http.routers.healthchecks.tls: "true"
      traefik.http.routers.healthchecks.middlewares: "security-headers@file,compression@file"
      traefik.http.services.healthchecks.loadbalancer.server.port: "8000"
    env_file:
      - .env
    environment:
      DB: postgres
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - proxy
      - internal
    depends_on:
      database:
        condition: service_healthy

networks:
  proxy:
    external: true

  internal:
    name: healthchecks-internal
    driver: bridge
