services:
  database:
    container_name: norish-database
    image: postgres:18.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ../../appdata/norish/database:/var/lib/postgresql
    networks:
      - internal
      - database-backup

  valkey:
    container_name: norish-valkey
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../appdata/norish/valkey:/data
    networks:
      - internal

  norish:
    container_name: norish-app
    image: norishapp/norish:v0.22.0-beta
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', r => process.exit(r.statusCode===200?0:1))\""]
      start_period: 1m
      interval: 1m
      timeout: 15s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.norish.rule: "Host(`norish.zech.co`)"
      traefik.http.routers.norish.entrypoints: "websecure"
      traefik.http.routers.norish.tls: "true"
      traefik.http.routers.norish.middlewares: "security-headers@file,compression@file"
      traefik.http.services.norish.loadbalancer.server.port: "3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME}
      REDIS_URL: redis://valkey:6379
      OBSCURA_ENDPOINT: ws://obscura:9222
    volumes:
      - ../../appdata/norish/uploads:/app/uploads
    networks:
      - proxy
      - internal
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy
      obscura:
        condition: service_started

  obscura:
    container_name: norish-obscura
    image: norishapp/obscura:0.2.0-norish.1
    restart: unless-stopped
    networks:
      - internal

networks:
  proxy:
    external: true

  database-backup:
    external: true

  internal:
    name: norish-internal
    driver: bridge
