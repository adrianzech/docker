services:
  database:
    container_name: postgresql
    image: postgres:18.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres", "-U", "postgres"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ../../appdata/postgresql/postgres:/var/lib/postgresql
