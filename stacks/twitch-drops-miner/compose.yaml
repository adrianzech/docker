services:
  twitch-drops-miner:
    container_name: twitch-drops-miner
    image: rangermix/twitch-drops-miner:1.2.6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.twitch-drops-miner.rule: "Host(`twitchdrops.zech.co`)"
      traefik.http.routers.twitch-drops-miner.entrypoints: "websecure"
      traefik.http.routers.twitch-drops-miner.tls: "true"
      traefik.http.routers.twitch-drops-miner.middlewares: "authentik@file,security-headers@file,compression@file"
      traefik.http.services.twitch-drops-miner.loadbalancer.server.port: "8080"
    volumes:
      - ../../appdata/twitch-drops-miner/data:/app/data
    networks:
      - proxy

networks:
  proxy:
    external: true
