services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthcheck || exit 1"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.homepage.rule: "Host(`dashboard.zech.co`)"
      traefik.http.routers.homepage.entrypoints: "websecure"
      traefik.http.routers.homepage.tls: "true"
      traefik.http.routers.homepage.middlewares: "security-headers@file,compression@file"
      traefik.http.services.homepage.loadbalancer.server.port: "3000"
    env_file:
      - .env
    environment:
      LOG_TARGETS: stdout
    volumes:
      - ../../appdata/homepage/config:/app/config
    networks:
      - proxy
      - socket-proxy
    depends_on:
      socket-proxy:
        condition: service_healthy

  socket-proxy:
    container_name: homepage-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:2375/version"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

networks:
  proxy:
    external: true

  socket-proxy:
    internal: true
