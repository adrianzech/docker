services:
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.3.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.radarr.rule: "Host(`radarr.zech.co`)"
      traefik.http.routers.radarr.entrypoints: "websecure"
      traefik.http.routers.radarr.tls: "true"
      traefik.http.routers.radarr-api.rule: "Host(`radarr.zech.co`) && (Path(`/api`) || PathPrefix(`/api/`))"
      traefik.http.routers.radarr-api.entrypoints: "websecure"
      traefik.http.routers.radarr-api.tls: "true"
      traefik.http.routers.radarr-api.priority: "100"
      traefik.http.routers.radarr-api.middlewares: "security-headers@file,compression@file"
      traefik.http.routers.radarr-api.service: "radarr"
      traefik.http.routers.radarr.middlewares: "authentik@file,security-headers@file,compression@file"
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
    environment:
      TZ: Europe/Vienna
      PUID: 1000
      PGID: 1000
    volumes:
      - ../../appdata/radarr/config:/config
      - /mnt/movies:/movies
      - /mnt/downloads/complete:/downloads
    networks:
      - proxy

networks:
  proxy:
    external: true
