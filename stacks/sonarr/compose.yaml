services:
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:develop@sha256:8ddf6604637402ae7e2c8640be939e42b3a5e66b8a81aa5e5deec1630bfcabc2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.sonarr.rule: "Host(`sonarr.zech.co`)"
      traefik.http.routers.sonarr.entrypoints: "websecure"
      traefik.http.routers.sonarr.tls: "true"
      traefik.http.routers.sonarr-api.rule: "Host(`sonarr.zech.co`) && (Path(`/api`) || PathPrefix(`/api/`))"
      traefik.http.routers.sonarr-api.entrypoints: "websecure"
      traefik.http.routers.sonarr-api.tls: "true"
      traefik.http.routers.sonarr-api.priority: "100"
      traefik.http.routers.sonarr-api.middlewares: "security-headers@file,compression@file"
      traefik.http.routers.sonarr-api.service: "sonarr"
      traefik.http.routers.sonarr.middlewares: "authentik@file,security-headers@file,compression@file"
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
    environment:
      TZ: Europe/Vienna
      PUID: 1000
      PGID: 1000
    volumes:
      - ../../appdata/sonarr/config:/config
      - /mnt/tv:/tv
      - /mnt/downloads:/downloads
    networks:
      - proxy

networks:
  proxy:
    external: true
