services:
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.grafana.rule: "Host(`grafana.zech.co`)"
      traefik.http.routers.grafana.entrypoints: "websecure"
      traefik.http.routers.grafana.tls: "true"
      traefik.http.routers.grafana.middlewares: "security-headers@file,compression@file"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    env_file:
      - .env
    volumes:
      - ../../appdata/grafana:/var/lib/grafana
    networks:
      - proxy

networks:
  proxy:
    external: true
