services:
  traefik:
    container_name: traefik
    image: traefik:v3.7.12
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "80:80"
      - "443:443"
      - "2222:2222"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.traefik.rule: "Host(`traefik.zech.co`)"
      traefik.http.routers.traefik.entrypoints: "websecure"
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.service: "api@internal"
      traefik.http.routers.traefik.middlewares: "internal-only@file"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../appdata/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../appdata/traefik/dynamic:/etc/traefik/dynamic:ro
      - ../../appdata/traefik/acme:/etc/traefik/acme
      - ../../appdata/traefik/logs:/var/log/traefik
    networks:
      - proxy

networks:
  proxy:
    external: true
