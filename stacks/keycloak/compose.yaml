services:
  database:
    container_name: keycloak-database
    image: postgres:18.6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ../../appdata/keycloak/postgres:/var/lib/postgresql
    networks:
      - internal

  server:
    container_name: keycloak-server
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start --server-async-bootstrap=false
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: database
      KC_DB_URL_DATABASE: ${DATABASE_NAME}
      KC_DB_USERNAME: ${DATABASE_USER}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    networks:
      - internal
    depends_on:
      database:
        condition: service_healthy

networks:
  internal:
    name: keycloak-internal
    driver: bridge
