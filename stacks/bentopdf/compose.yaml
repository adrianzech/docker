services:
  bentopdf:
    container_name: bentopdf
    image: ghcr.io/alam00000/bentopdf-simple:2.8.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.bentopdf.rule: "Host(`pdf.zech.co`)"
      traefik.http.routers.bentopdf.entrypoints: "websecure"
      traefik.http.routers.bentopdf.tls: "true"
      traefik.http.routers.bentopdf.middlewares: "authentik@file,security-headers@file,compression@file"
      traefik.http.services.bentopdf.loadbalancer.server.port: "8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
