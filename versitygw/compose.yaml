services:
  versitygw:
    container_name: versitygw
    image: versity/versitygw:v1.7.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7070/health"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      # Web UI
      traefik.http.routers.versitygw-web.rule: "Host(`web.s3.zech.co`)"
      traefik.http.routers.versitygw-web.entrypoints: "websecure"
      traefik.http.routers.versitygw-web.tls: "true"
      traefik.http.routers.versitygw-web.tls.certresolver: "letsencrypt"
      traefik.http.routers.versitygw-web.tls.domains[0].main: "s3.zech.co"
      traefik.http.routers.versitygw-web.tls.domains[0].sans: "*.s3.zech.co"
      traefik.http.routers.versitygw-web.middlewares: "security-headers@file,compression@file"
      traefik.http.routers.versitygw-web.service: "versitygw-web"
      traefik.http.services.versitygw-web.loadbalancer.server.port: "8080"
      # S3 API
      traefik.http.routers.versitygw-api.rule: "Host(`api.s3.zech.co`)"
      traefik.http.routers.versitygw-api.entrypoints: "websecure"
      traefik.http.routers.versitygw-api.tls: "true"
      traefik.http.routers.versitygw-api.tls.certresolver: "letsencrypt"
      traefik.http.routers.versitygw-api.middlewares: "security-headers@file,compression@file"
      traefik.http.routers.versitygw-api.service: "versitygw-api"
      traefik.http.services.versitygw-api.loadbalancer.server.port: "7070"
      # Admin API
      traefik.http.routers.versitygw-admin.rule: "Host(`admin.s3.zech.co`)"
      traefik.http.routers.versitygw-admin.entrypoints: "websecure"
      traefik.http.routers.versitygw-admin.tls: "true"
      traefik.http.routers.versitygw-admin.tls.certresolver: "letsencrypt"
      traefik.http.routers.versitygw-admin.middlewares: "security-headers@file,compression@file"
      traefik.http.routers.versitygw-admin.service: "versitygw-admin"
      traefik.http.services.versitygw-admin.loadbalancer.server.port: "7071"
    env_file:
      - .env
    volumes:
      - /mnt/s3/data:/data/s3
      - /mnt/s3/versioning:/data/versioning
      - /opt/appdata/versitygw/iam:/data/iam
      - /opt/appdata/versitygw/metadata:/data/metadata
    networks:
      - proxy

networks:
  proxy:
    external: true
